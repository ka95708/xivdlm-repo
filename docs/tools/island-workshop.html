<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無人島自動工坊文字轉換 — xivdlm 小工具</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap wide">
  <a class="crumb" href="../index.html">← 回工具首頁</a>

  <header>
    <h1>無人島自動工坊文字轉換</h1>
    <p class="subtitle">把 island.ffxiv.cyou 的排程轉成自動工坊插件用的台服物品清單。分享網址、「复制」按鈕的文字、直接選取的表格文字都吃。</p>
  </header>

  <section class="embed">
    <div class="embed-bar">
      <span>排班表 — island.ffxiv.cyou</span>
      <a href="https://island.ffxiv.cyou/#/plan" target="_blank" rel="noopener">在新分頁開啟 ↗</a>
      <button id="toggleEmbed" type="button">收合</button>
    </div>
    <iframe id="planner"
            src="https://island.ffxiv.cyou/#/plan"
            title="island.ffxiv.cyou 排班表"
            allow="clipboard-write https://island.ffxiv.cyou"
            referrerpolicy="no-referrer"
            loading="lazy"></iframe>
  </section>

  <div class="panes">
    <div class="pane">
      <label for="src">貼上排程<span id="fmt" class="fmt"></span></label>
      <textarea id="src" spellcheck="false" placeholder="三種都可以：&#10;· 分享網址 https://island.ffxiv.cyou/#/plan/gAACNjtF…&#10;· 按「复制」得到的文字&#10;· 直接選取排班表複製的文字"></textarea>
    </div>
    <div class="pane">
      <label for="out">轉換結果</label>
      <textarea id="out" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="bar">
    <button id="paste" class="primary">貼上並轉換</button>
    <button id="copy">複製結果</button>
    <button id="clear">清空</button>
    <span id="status" class="status"></span>
  </div>

  <div id="warn" class="note warn" hidden></div>

  <details class="dict">
    <summary>配方對應表（<span id="dictCount"></span> 項）</summary>
    <table id="dictTable"></table>
  </details>

  <footer>
    <a href="https://github.com/ka95708/xivdlm-repo">ka95708/xivdlm-repo</a>
  </footer>
</div>

<script src="../assets/island-items.js"></script>
<script>
// ---------------------------------------------------------------------------
// 工坊組數 → 輸出標題
// ---------------------------------------------------------------------------
const GROUP_LABEL = { 1: '4th Workshop', 3: 'First 3 Workshops', 4: 'All Workshops' };
const RECIPES = window.ISLAND_RECIPES;
const BY_CN = (() => {
  const m = {};
  RECIPES.forEach((r, id) => { if (r) m[r.cn] = id; });
  return m;
})();

// 三種輸入都解析成 [{ rest, groups: [{ worker, items: [{ id, name }] }] }]

function toItem(id) {
  const r = RECIPES[id];
  return { id, name: r ? r.tw : '配方#' + id };
}

function byName(cn) {
  const id = BY_CN[cn];
  return id ? toItem(id) : { id: 0, name: cn, unknown: true };
}

// --- 格式一：分享碼 / 分享網址 --------------------------------------------
// 位元組結構（取自站方 main.js 的 Rd/Md）：
//   [128] 每週期:[組數] 每組:[(工坊數<<4)|物品數] + 物品數個配方 ID
//   第一個位元組 <128 為舊格式：每週期 [物品數] + 配方 ID，沒有工坊數
function decodeShareCode(code) {
  const b64 = code.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '=='.slice(2 - (b64.length & 3) & 3));
  const e = Uint8Array.from(bin, c => c.charCodeAt(0));
  const cycles = [];

  if (e[0] !== 128) {                                   // 舊格式
    for (let s = 0; s < e.length; s++) {
      const n = e[s];
      const steps = Array.from(e.slice(s + 1, s + 1 + n));
      cycles.push({
        rest: steps.length === 0,
        groups: steps.length ? [{ worker: 4, items: steps.map(toItem), legacy: true }] : [],
      });
      s += n;
    }
    return cycles;
  }

  for (let s = 1; s < e.length; s++) {                   // 現行格式
    const n = e[s++];
    const groups = [];
    for (let u = 0; u < n; u++) {
      const r = e[s++], worker = r >> 4, len = r & 15;
      groups.push({ worker, items: Array.from(e.slice(s, s + len)).map(toItem) });
      s += len;
    }
    cycles.push({ rest: groups.length === 0, groups });
    s--;
  }
  return cycles;
}

// --- 格式二：「复制」按鈕的文字 --------------------------------------------
//   第1天: 休息
//   第2天: 5508
//       3× 新薯沙拉, 煎红花菜豆, 面包
function parseCopyText(text) {
  const cycles = [];
  let cycle = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    const day = /^第\s*(\d+)\s*天\s*[:：]\s*(.*)$/.exec(line);
    if (day) {
      cycle = { rest: /^休息/.test(day[2]), groups: [] };
      cycles.push(cycle);
      continue;
    }
    const grp = /^(\d+)\s*[×xX]\s*(.+)$/.exec(line);
    if (grp && cycle) {
      const items = grp[2].split(/[,，]/).map(s => s.trim()).filter(Boolean).map(byName);
      cycle.groups.push({ worker: Number(grp[1]), items });
    }
  }
  return cycles;
}

// --- 格式三：直接選取排班表的文字 ------------------------------------------
//   第2天 / 5806 / 3 / × / 新薯沙拉 / 874h / …
function parseTableText(text) {
  const RE_TIME = /^\d+\s*h$/i, RE_NUM = /^\d+$/, RE_MULT = /^[×xX✕╳*]$/;
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const cycles = [];
  let cycle = null, group = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const day = /^第\s*(\d+)\s*天$/.exec(line);
    if (day) { cycle = { rest: false, groups: [] }; cycles.push(cycle); group = null; continue; }
    if (!cycle) continue;                       // 第1天之前的收益、網址等雜訊
    if (/^休息$/.test(line)) { cycle.rest = true; continue; }
    if (RE_TIME.test(line) || RE_MULT.test(line)) continue;
    if (RE_NUM.test(line)) {
      if (RE_MULT.test(lines[i + 1] || '')) {   // 後面接 × 才是工坊組數
        group = { worker: Number(line), items: [] };
        cycle.groups.push(group);
      }
      continue;                                 // 否則是當日收益
    }
    if (group) group.items.push(byName(line));
  }
  return cycles;
}

// --- 自動判斷格式 -----------------------------------------------------------
function parseAny(text) {
  const t = text.trim();
  const link = /#\/plan\/([A-Za-z0-9_-]{8,})/.exec(t);
  const bare = /^[A-Za-z0-9_-]{8,}$/.test(t) ? t : null;
  if (link || bare) {
    try {
      return { kind: '分享碼', cycles: decodeShareCode(link ? link[1] : bare) };
    } catch (err) {
      return { kind: '分享碼', cycles: [], error: '分享碼解不開：' + err.message };
    }
  }
  if (/^\s*第\s*\d+\s*天\s*[:：]/m.test(t)) return { kind: '复制文字', cycles: parseCopyText(t) };
  return { kind: '表格文字', cycles: parseTableText(t) };
}

function convert(text) {
  const r = parseAny(text);
  const unknownNames = new Set(), oddWorkers = new Set();
  const out = [];
  let legacy = false;

  for (let i = 0; i < r.cycles.length; i++) {
    const c = r.cycles[i];
    out.push('Cycle ' + (i + 1));
    c.groups.forEach((g, gi) => {
      if (gi > 0) out.push('.');
      if (g.legacy) legacy = true;
      if (!GROUP_LABEL[g.worker]) oddWorkers.add(g.worker);
      out.push(GROUP_LABEL[g.worker] || (g.worker + ' Workshops'));
      for (const it of g.items) {
        if (it.unknown) unknownNames.add(it.name);
        out.push(it.name);
      }
    });
  }
  return Object.assign({}, r, {
    text: out.join('\n'),
    unknownNames: [...unknownNames],
    oddWorkers: [...oddWorkers],
    legacy,
  });
}

const src = document.getElementById('src');
const out = document.getElementById('out');
const status = document.getElementById('status');
const warn = document.getElementById('warn');
const fmt = document.getElementById('fmt');

function setStatus(msg, ok) {
  status.textContent = msg;
  status.classList.toggle('ok', !!ok);
}

function run() {
  if (!src.value.trim()) {
    out.value = ''; warn.hidden = true; fmt.textContent = ''; setStatus('');
    return;
  }
  const r = convert(src.value);
  out.value = r.text;
  fmt.textContent = '（辨識為' + r.kind + '）';

  const items = r.cycles.reduce((n, c) => n + c.groups.reduce((k, g) => k + g.items.length, 0), 0);
  const rest = r.cycles.filter(c => c.rest).length;
  setStatus(r.cycles.length
    ? r.cycles.length + ' 個週期（休息 ' + rest + ' 天）、' + items + ' 件成品'
    : '看不出排程內容');

  const msgs = [];
  if (r.error) msgs.push(r.error);
  if (r.unknownNames.length) {
    msgs.push('對應表沒有這些名稱，已原樣輸出：' + r.unknownNames.map(n => '<code>' + n + '</code>').join('、'));
  }
  if (r.oddWorkers.length) {
    msgs.push('出現非 1／3／4 的工坊數（' + r.oddWorkers.join('、') + '），標題用「N Workshops」代替，插件不一定吃。');
  }
  if (r.legacy) msgs.push('這是舊版分享碼，裡面沒有工坊數，一律當成 All Workshops。');
  warn.hidden = !msgs.length;
  warn.innerHTML = msgs.join('<br>');
}

src.addEventListener('input', run);

document.getElementById('paste').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text.trim()) { setStatus('剪貼簿是空的'); return; }
    src.value = text;
    run();
  } catch {
    setStatus('瀏覽器不給讀剪貼簿，請直接 Ctrl+V 貼到左欄');
    src.focus();
  }
});

document.getElementById('copy').addEventListener('click', async () => {
  if (!out.value) { setStatus('沒有可複製的內容'); return; }
  try {
    await navigator.clipboard.writeText(out.value);
  } catch {
    out.select();
    document.execCommand('copy');
  }
  setStatus('已複製', true);
});

document.getElementById('clear').addEventListener('click', () => {
  src.value = '';
  run();
  src.focus();
});

document.getElementById('toggleEmbed').addEventListener('click', (e) => {
  const collapsed = document.querySelector('.embed').classList.toggle('collapsed');
  e.target.textContent = collapsed ? '展開' : '收合';
});

// 對應表列出來，方便查漏
(function fillDict() {
  document.getElementById('dictCount').textContent = RECIPES.length - 1;
  document.getElementById('dictTable').innerHTML = RECIPES
    .map((r, id) => r ? '<tr><td>' + id + '</td><td>' + r.cn + '</td><td>→</td><td>' + r.tw + '</td></tr>' : '')
    .join('');
})();

run();
</script>
</body>
</html>
